version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: collector-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: collector
      POSTGRES_DB: collector
    ports:
      - '5432:5432'
    volumes:
      - collector-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U collector']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: collector-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - collector-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Descomentar cuando el Dockerfile esté listo para build de la app:
  # collector:
  #   build:
  #     context: ..
  #     dockerfile: docker/Dockerfile
  #   container_name: collector-app
  #   restart: unless-stopped
  #   env_file:
  #     - ../.env
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   ports:
  #     - '3000:3000'

volumes:
  collector-postgres-data:
  collector-redis-data:
