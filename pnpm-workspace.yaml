packages:
  - 'assu-backend'
  - 'assu-frontend'
  - 'assu-home'
  - 'assu-portal'
  - 'packages/*'

# NOTA: `neverBuiltDependencies` NO se lee desde pnpm-workspace.yaml en pnpm 9.
# Debe ir en el campo "pnpm" del package.json de la RAÍZ (ver package.json).
# Si se deja aquí, pnpm ejecuta igual los postinstall (p. ej. el `opencollective`
# de @nestjs/core y tesseract.js), que hacen peticiones de red y dejan la
# instalación "congelada" al final.
